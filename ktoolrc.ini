[container]
podname = st-ozone-test-pod
namespace = qainfra

[kubernetes]
kubeconfig = secrets/config-rke
pod_liveness_check = true

[live_clusters]
enabled = true
api_url = http://10.240.67.203:8083
pool_slot_ids = 1,2
auto_reserve = true
reserved_by =

[mapping]
dst_package_dir = /usr/local/lib/python3.6/dist-packages
dst_test_dir = /hwqe/hadoopqe
dst_yaml_dir = /ansible

[command]
kcp = /usr/local/bin/kubectl --kubeconfig $kubeconfig cp $src_path ${namespace}/${podname}:${dest_path}
kexec = /usr/local/bin/kubectl --kubeconfig $kubeconfig exec -t $podname -n $namespace -c system-test -- $command
kpf = /usr/local/bin/kubectl --kubeconfig $kubeconfig port-forward pod/$podname -n $namespace 5678:5678 --address 127.0.0.1
sudo_login_and_run = sudo su - hrt_qa -c "$run_command"
login_and_run = su -c "$run_command" 
texas_entry = pkill supervisord && texas_test_entrypoint --test-type system_test --run-tests-path /ansible/system_test.yml
ansible_play = ansible-playbook $yaml_file
cd_and_run = source /etc/profile && cd $test_dir && $test_command
pytest = python3 -m pytest $test_file_path --output-dir=artifacts_${test_name} --junitxml=artifacts_${test_name}/junit.xml  2>&1 | tee /tmp/console_${test_name}.log  
; --copy-server-logs --html=artifacts_${test_name}.html --self-contained-html --log-level=INFO 
pytest_debug = mv artifacts artifacts.$$ && python3 -m debugpy --wait-for-client --listen 0.0.0.0:5678 -m pytest -s $test_file_path --output-dir=artifacts_${test_name} --junitxml=artifacts_${test_name}/junit.xml 2>&1 | tee /tmp/console_${test_name}.log
